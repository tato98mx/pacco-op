name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 Web export templates
        run: |
          set -eu
          archive=/tmp/Godot_v4.3-stable_export_templates.tpz
          temp_dir=/tmp/godot-export-templates
          templates_dir="$HOME/.local/share/godot/export_templates/4.3.stable"
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            --output "$archive"
          mkdir -p "$temp_dir" "$templates_dir"
          unzip -q "$archive" -d "$temp_dir"
          test -d "$temp_dir/templates"
          cp -a "$temp_dir/templates/." "$templates_dir/"
          test -f "$templates_dir/web_nothreads_debug.zip"
          test -f "$templates_dir/web_nothreads_release.zip"
      - name: Import + export Web
        run: |
          mkdir -v -p build/web
          godot --headless --import || true
          godot --headless --verbose --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
